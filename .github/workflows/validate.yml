name: Source validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-test.txt
      - run: npm ci --prefix tools/api-ledger --ignore-scripts --no-audit --no-fund
      - run: python -m unittest discover -s tests/bootstrap -v
      - run: python scripts/validate_bootstrap.py
      - run: python scripts/validate_core.py
      - run: python scripts/validate_licenses.py
      - run: node scripts/inventory-public-api.mjs --check
      - run: node --test tests/contracts/api-ledger.test.mjs
