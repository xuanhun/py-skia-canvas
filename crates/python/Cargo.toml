[package]
name = "py-skia-canvas-native"
version = "0.1.0-alpha.18"
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[features]
default = ["window"]
window = ["canvas-core/window"]
vulkan = ["canvas-core/vulkan"]
metal = ["canvas-core/metal"]
freetype = ["canvas-core/freetype"]

[dependencies]
canvas-core = { path = "../canvas-core" }
pyo3 = { version = "=0.27.2", features = ["extension-module"] }
skia-safe = { version = "=0.88.0", features = ["textlayout", "webp", "svg"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
rayon = "=1.11.0"

[build-dependencies]
cc = "=1.2.38"

# Source installs retain the original platform GPU feature policy without CLI flags.
[target.'cfg(target_os = "linux")'.dependencies]
canvas-core = { path = "../canvas-core", features = ["vulkan", "freetype"] }

[target.'cfg(target_os = "windows")'.dependencies]
canvas-core = { path = "../canvas-core", features = ["vulkan"] }

[target.'cfg(target_os = "macos")'.dependencies]
canvas-core = { path = "../canvas-core", features = ["metal"] }
